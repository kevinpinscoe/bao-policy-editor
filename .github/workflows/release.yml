name: Release

# Triggered only by a semantic-version tag. Nothing here runs on a pull
# request, a branch push, or a fork — which is what keeps the secrets below out
# of reach of anyone who can open a pull request, since a fork cannot push a
# tag to this repository.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Least privilege, and nothing more. contents:write creates the release and
# uploads its assets; id-token:write is what lets cosign obtain a short-lived
# Sigstore certificate from GitHub's OIDC provider.
permissions:
  contents: write
  id-token: write

# Pinned once, used everywhere, and documented in RUNBOOK.md. A release built
# by a different toolchain than the one its dry run used is a release nobody
# actually rehearsed: floating versions mean the first time a new GoReleaser,
# syft or cosign runs against this repository is while it is publishing.
env:
  GORELEASER_VERSION: "2.17.1"
  SYFT_VERSION: "v1.49.0"
  COSIGN_VERSION: "v3.0.6"

jobs:
  # Everything that can refuse happens here, before a single artifact exists.
  # Both checks below are fail-closed: the job exits non-zero on anything it
  # cannot positively confirm, and `release` will not start.
  preflight:
    name: Verify the tag and the credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # --- the tag -----------------------------------------------------
      #
      # A tag is the only authorization this pipeline has: pushing one
      # publishes a release and notifies four other repositories. So the tag
      # is checked rather than trusted. Four separate properties, each able to
      # stop the run on its own.
      - name: Verify the triggering tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "::group::Tag object"
          # 1. Annotated, not lightweight. A lightweight tag is a bare ref with
          #    no object of its own — it carries no tagger, no message and
          #    nothing that can be signed, so the remaining checks would have
          #    nothing to inspect.
          object_type=$(git cat-file -t "refs/tags/${TAG}")
          echo "tag object type: ${object_type}"
          if [ "${object_type}" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag. Releases are cut from annotated, signed tags (git tag -s)."
            exit 1
          fi

          # 2. GitHub reports the signature as verified. This is GitHub's own
          #    judgement against the keys registered on the account, not a
          #    local check that would pass for any key at all.
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')
          reason=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.reason')
          echo "signature verified: ${verified} (${reason})"
          if [ "${verified}" != "true" ]; then
            echo "::error::${TAG}'s signature is not verified by GitHub (reason: ${reason})."
            exit 1
          fi

          # 3. It ultimately points at the commit being built. An annotated tag
          #    can point at another tag, or at a tree or blob; ^{commit}
          #    resolves the whole chain. If this disagreed with the checked-out
          #    SHA, the release would carry a version that names one commit and
          #    contents from another.
          tagged_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          echo "tag resolves to: ${tagged_commit}"
          echo "checked out:     ${HEAD_SHA}"
          if [ "${tagged_commit}" != "${HEAD_SHA}" ]; then
            echo "::error::${TAG} resolves to ${tagged_commit}, but this run checked out ${HEAD_SHA}."
            exit 1
          fi

          # 4. That commit is on the default branch. This is what stops a
          #    release being cut from a branch that was never reviewed or
          #    merged — a tag can be pushed from any local commit at all.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${tagged_commit}" origin/main; then
            echo "::error::${tagged_commit} is not contained in origin/main. Release only from merged commits."
            exit 1
          fi
          echo "${tagged_commit} is contained in origin/main"
          echo "::endgroup::"

          echo "Tag ${TAG} accepted: annotated, verified, resolves to the built commit, and merged."

      # --- the credentials ----------------------------------------------
      #
      # GoReleaser pushes to three other repositories near the *end* of its
      # run, after the release and its artifacts already exist. A token that
      # is missing or under-scoped therefore fails late, leaving a published
      # release with no cask, no manifest and no package repositories — the
      # half-finished state this repository's release procedure forbids.
      # Proving the access up front turns that into a refusal to start.
      #
      # Every check is read-only. Token values reach `gh` only through the
      # environment: never echoed, never written, never a command-line
      # argument, and `set -x` is never enabled in this step.
      - name: Verify the release credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          missing=0
          for name in HOMEBREW_TAP_TOKEN SCOOP_BUCKET_TOKEN REPO_DISPATCH_TOKEN; do
            # Indirect expansion reads the value without ever rendering it.
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is empty or unset on this repository."
              missing=1
            else
              echo "${name}: present"
            fi
          done
          [ "${missing}" -eq 0 ] || {
            echo "::error::Set the missing secrets before tagging. See RUNBOOK.md Step 16."
            exit 1
          }

          # can_push <TOKEN_ENV_NAME> <owner/repo>
          #
          # Asks the API what the token may do with a repository. The
          # `permissions.push` field is GitHub's own answer for the
          # authenticated identity, so this proves write access without
          # writing anything. The token is passed by exporting GH_TOKEN for
          # the single command, never as an argument.
          can_push() {
            local token_name="$1" repo="$2" push
            push=$(GH_TOKEN="${!token_name}" gh api "repos/${repo}" --jq '.permissions.push' 2>/dev/null || echo "error")
            if [ "${push}" != "true" ]; then
              echo "::error::${token_name} cannot push to ${repo} (permissions.push=${push}). It needs Contents: read and write on that repository."
              return 1
            fi
            echo "${token_name} -> ${repo}: push confirmed"
          }

          failed=0
          can_push HOMEBREW_TAP_TOKEN  kevinpinscoe/homebrew-tap  || failed=1
          can_push SCOOP_BUCKET_TOKEN  kevinpinscoe/scoop-bucket  || failed=1
          # One token, both package repositories: the dispatch that notifies
          # them is Contents-write on each, not an Actions permission.
          can_push REPO_DISPATCH_TOKEN kevinpinscoe/apt           || failed=1
          can_push REPO_DISPATCH_TOKEN kevinpinscoe/rpm           || failed=1
          [ "${failed}" -eq 0 ] || exit 1

          echo "All three credentials proven before anything is built."

  release:
    name: Build, sign and publish
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds release notes from the commit range since the
          # previous tag, so it needs the whole history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          # GITHUB_TOKEN is injected by Actions and needs no secret of its own.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by GoReleaser's homebrew_casks and scoops blocks to push
          # to repositories this one cannot otherwise write to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # The package repositories build their own indexes from the published
      # release. `new-release` is the event both of their add-package.yml
      # workflows already listen for; it is not a mechanism invented here.
      - name: Notify apt repo
        run: |
          gh api repos/kevinpinscoe/apt/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Notify rpm repo
        run: |
          gh api repos/kevinpinscoe/rpm/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
