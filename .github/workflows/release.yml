name: Release

# Triggered only by a semantic-version tag. Nothing on this workflow runs on a
# pull request, a branch push, or a fork — which is what keeps the secrets
# below out of reach of anyone who can open a pull request, since a fork
# cannot push a tag to this repository.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Least privilege, and nothing more. contents:write creates the release and
# uploads its assets; id-token:write is what lets cosign obtain a short-lived
# Sigstore certificate from GitHub's OIDC provider. No packages, no actions,
# no pull-requests scope.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds release notes from the commit range since the
          # previous tag, so it needs the whole history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # GITHUB_TOKEN is injected by Actions and needs no secret of its own.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These two are consumed by GoReleaser's homebrew_casks and scoops
          # blocks to push to repositories this one cannot otherwise write to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # The package repositories build their own indexes from the published
      # release. `new-release` is the event both of their add-package.yml
      # workflows already listen for; it is not a mechanism invented here.
      - name: Notify apt repo
        run: |
          gh api repos/kevinpinscoe/apt/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Notify rpm repo
        run: |
          gh api repos/kevinpinscoe/rpm/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
